<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD8" />
      <stop offset="50%" stop-color="#E9D1B4" />
      <stop offset="100%" stop-color="#D4AA6A" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5C26" />
      <stop offset="100%" stop-color="#643D12" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#73491E" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" />
  
  <!-- Chef Hat Line Art matching reference -->
  <g transform="translate(136, 126)" fill="none" stroke="url(#hatGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Puffs -->
    <path d="M40 160 C10 130 10 70 50 40 C80 16 120 20 140 50 C160 16 200 16 230 46 C270 80 260 135 240 160 Z" />
    <!-- Center puff crease -->
    <path d="M120 70 C130 110 130 140 135 160" stroke-width="12" stroke-opacity="0.8" />
    <path d="M165 70 C160 105 155 135 150 160" stroke-width="12" stroke-opacity="0.8" />
    <!-- Hat band -->
    <path d="M50 176 L230 176 C236 176 240 180 240 186 L236 214 C236 220 231 224 225 224 L55 224 C49 224 44 220 44 214 L40 186 C40 180 44 176 50 176 Z" />
    <!-- Band line -->
    <line x1="60" y1="200" x2="220" y2="200" stroke-width="10" stroke-opacity="0.6" />
  </g>
</svg>
