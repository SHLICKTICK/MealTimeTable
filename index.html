<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MealWeek — Weekly Meal Planner</title>
    <meta name="description" content="A premium Apple-inspired weekly meal planning PWA with warm luxury aesthetics, glassmorphism, recipe management, and offline support." />
    
    <meta property="og:title" content="MealWeek — Weekly Meal Planner" />
    <meta property="og:description" content="A premium Apple-inspired weekly meal planning PWA with warm luxury aesthetics, glassmorphism, recipe management, and offline support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Settings -->
    <meta name="theme-color" content="#F8F4F0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MealWeek" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Editorial Serif + Clean Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Gracefully silence HMR WebSocket errors in environments where HMR is disabled
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.message?.includes('ws://') || e.message?.includes('wss://'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (e.reason.message?.includes('WebSocket') || e.reason.message?.includes('ws://'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#F8F4F0] text-[#25221F] antialiased select-none overflow-x-hidden min-h-screen">
    <div id="app" class="min-h-screen w-full flex flex-col justify-between"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
